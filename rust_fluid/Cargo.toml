glam = "0.33.7"
pollster = "1.0.1"
resvg = "0.48.1"
stl_io = "0.11.0"
tiny-skia = "0.12.0"
wgpu = "30.0.1"
winit = {version = "0.30.13", features = ["rwh_06"]}
