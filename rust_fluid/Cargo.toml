[package]
name = "rust_fluid"
version = "0.1.0"
edition = "2024"
default-run = "rust_fluid"

[dependencies]
bytemuck = {version = "1.25.2", features = ["derive"]}
egui = "0.36.2"
egui-wgpu = "0.36.2"
